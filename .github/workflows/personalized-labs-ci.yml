name: personalized-labs-ci

on:
  push:
    branches: [main]
    paths:
      - 'apps/personalized-labs/**'
      - 'apps/lab-hub/**'
      - '.github/workflows/personalized-labs-ci.yml'
  pull_request:
    paths:
      - 'apps/personalized-labs/**'
      - 'apps/lab-hub/**'
      - '.github/workflows/personalized-labs-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: |
          node --check apps/personalized-labs/labs-a.js
          node --check apps/personalized-labs/labs-b.js
          node --check apps/personalized-labs/labs-c.js
          node --check apps/personalized-labs/layout-base.js
          node --check apps/personalized-labs/layout-bodies-a.js
          node --check apps/personalized-labs/layout-bodies-b.js
          node --check apps/personalized-labs/layout-bodies-c.js
          node --check apps/personalized-labs/layout-css-a.js
          node --check apps/personalized-labs/layout-css-b.js
          node --check apps/personalized-labs/layout-css-c.js
          node --check apps/personalized-labs/core.js
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('apps/lab-hub/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          Path('/tmp/lab-hub.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/lab-hub.js
      - name: Validate required files
        run: |
          test -s apps/lab-hub/index.html
          test -s apps/personalized-labs/index.html
          test -s apps/personalized-labs/core.js
          test -s apps/personalized-labs/labs-a.js
          test -s apps/personalized-labs/labs-b.js
          test -s apps/personalized-labs/labs-c.js
          test -s apps/personalized-labs/layout-base.js
          test -s apps/personalized-labs/layout-bodies-a.js
          test -s apps/personalized-labs/layout-bodies-b.js
          test -s apps/personalized-labs/layout-bodies-c.js
          test -s apps/personalized-labs/layout-css-a.js
          test -s apps/personalized-labs/layout-css-b.js
          test -s apps/personalized-labs/layout-css-c.js
